services:
  sec-monitor:
    build:
      context: .
    image: sec-monitor:local
    container_name: sec-monitor
    restart: unless-stopped
    ports:
      # SEC Monitor has no application login layer. Keep the local-first
      # deployment on loopback unless a reverse proxy/auth gateway is added.
      - "127.0.0.1:9090:8080"
    environment:
      APP_ADDR: ":8080"
      DB_TYPE: sqlite
      DB_DSN: /app/data/sec_monitor.db
      WEB_DIST_DIR: /app/web
      SMALL_CAP_CACHE_DIR: /app/data/.cache/discovery
      SMALL_CAP_RESEARCH_MODE: "${SMALL_CAP_RESEARCH_MODE:-true}"
      SMALL_CAP_TIINGO_CONCURRENCY: "${SMALL_CAP_TIINGO_CONCURRENCY:-1}"
      SMALL_CAP_TIINGO_REQUEST_BUDGET: "${SMALL_CAP_TIINGO_REQUEST_BUDGET:-45}"
      SMALL_CAP_TIINGO_REQUEST_INTERVAL_MS: "${SMALL_CAP_TIINGO_REQUEST_INTERVAL_MS:-1000}"
      TIINGO_API_TOKEN: "${TIINGO_API_TOKEN:-}"
      TIINGO_API_TOKENS: "${TIINGO_API_TOKENS:-}"
      CONFIG_ENCRYPTION_KEY: "${CONFIG_ENCRYPTION_KEY:-}"
      # The application database stays in the named volume. A verified second
      # copy is written to a host bind mount so deleting/recreating that volume
      # does not remove every recovery point.
      SEC_MONITOR_BACKUP_REPLICA_DIR: /app/backup-replica
      SEC_BASE_URL: https://data.sec.gov
      SEC_USER_AGENT: "${SEC_USER_AGENT:-sec-monitor/0.1 your-email@example.com}"
      SEC_TIMEOUT_MS: "10000"
    volumes:
      - sec-monitor-data:/app/data
      - "${SEC_MONITOR_BACKUP_REPLICA_HOST_DIR:-./backups}:/app/backup-replica"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://127.0.0.1:8080/healthz | grep -q '\"status\":\"ok\"'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  sec-monitor-data:
