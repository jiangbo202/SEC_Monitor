services:
  sec-monitor:
    build:
      context: .
    image: sec-monitor:local
    container_name: sec-monitor
    restart: unless-stopped
    ports:
      - "9090:8080"
    environment:
      APP_ADDR: ":8080"
      DB_TYPE: sqlite
      DB_DSN: /app/data/sec_monitor.db
      WEB_DIST_DIR: /app/web
      SMALL_CAP_CACHE_DIR: /app/data/.cache/discovery
      SMALL_CAP_RESEARCH_MODE: "${SMALL_CAP_RESEARCH_MODE:-true}"
      SMALL_CAP_TIINGO_CONCURRENCY: "${SMALL_CAP_TIINGO_CONCURRENCY:-1}"
      SMALL_CAP_TIINGO_REQUEST_BUDGET: "${SMALL_CAP_TIINGO_REQUEST_BUDGET:-45}"
      SMALL_CAP_TIINGO_REQUEST_INTERVAL_MS: "${SMALL_CAP_TIINGO_REQUEST_INTERVAL_MS:-1000}"
      TIINGO_API_TOKEN: "${TIINGO_API_TOKEN:-}"
      TIINGO_API_TOKENS: "${TIINGO_API_TOKENS:-}"
      CONFIG_ENCRYPTION_KEY: "${CONFIG_ENCRYPTION_KEY:-}"
      SEC_BASE_URL: https://data.sec.gov
      SEC_USER_AGENT: "${SEC_USER_AGENT:-sec-monitor/0.1 your-email@example.com}"
      SEC_TIMEOUT_MS: "10000"
    volumes:
      - sec-monitor-data:/app/data

volumes:
  sec-monitor-data:
